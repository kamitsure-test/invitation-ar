<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR Minimal Test</title>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <!-- MindAR (Image Tracking) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
      z-index: 9999;
      font-size: 16px;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="start">TAP TO START CAMERA</div>

  <script>
    document.getElementById('start').addEventListener('click', async () => {
      const overlay = document.getElementById('start');
      overlay.innerText = 'STARTING...';
      overlay.style.pointerEvents = 'none';

      try {
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: './targets.mind'
        });

        const { renderer, scene, camera } = mindarThree;
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

        const anchor = mindarThree.addAnchor(0);
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.3, 0.3),
          new THREE.MeshNormalMaterial()
        );
        anchor.group.add(box);

        renderer.setAnimationLoop(() => {
          box.rotation.x += 0.01;
          box.rotation.y += 0.01;
          renderer.render(scene, camera);
        });

        await mindarThree.start();
        overlay.style.display = 'none';
      } catch (e) {
        overlay.innerText = 'ERROR';
        alert(e);
      }
    });
  </script>
</body>
</html>
