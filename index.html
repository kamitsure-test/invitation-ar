
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Invitation WebAR</title>

  <!-- ✅ Three.js（必須） -->
  https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js
  <!-- ✅ MindAR（Image Tracking） -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
      z-index: 10;
      font-size: 14px;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>
  <div id="loading">Loading AR…</div>

  <script>
    const start = async () => {
      // ==============================
      // MindAR 初期化
      // ==============================
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.body,
        imageTargetSrc: './targets.mind' // 表紙画像から作った targets.mind
      });

      const { renderer, scene, camera } = mindarThree;

      // 照明（最低限・質感補助）
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // マーカー（1枚のみなので index=0）
      const anchor = mindarThree.addAnchor(0);

      const loader = new THREE.TextureLoader();

      // ==============================
      // 浮き出る「模様」レイヤー
      // ==============================
      const patternTexture = loader.load('./pattern.png');
      const pattern = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1.4), // A5縦比率
        new THREE.MeshBasicMaterial({
          map: patternTexture,
          transparent: true,
          opacity: 0
        })
      );
      pattern.position.set(0, 0, 0.01); // 少し手前に出して浮遊感
      anchor.group.add(pattern);

      // ==============================
      // （任意）イベント名・タイポ
      // title.png が無い場合は削除OK
      // ==============================
      let title = null;
      try {
        const titleTexture = loader.load('./title.png');
        title = new THREE.Mesh(
          new THREE.PlaneGeometry(0.8, 0.2),
          new THREE.MeshBasicMaterial({
            map: titleTexture,
            transparent: true,
            opacity: 0
          })
        );
        title.position.set(0, 0.6, 0.02);
        anchor.group.add(title);
      } catch (e) {
        console.log('title.png not found, skip');
      }

      let isFound = false;

      anchor.onTargetFound = () => {
        isFound = true;
        document.getElementById('loading').style.display = 'none';
      };

      anchor.onTargetLost = () => {
        isFound = false;
        pattern.material.opacity = 0;
        if (title) title.material.opacity = 0;
      };

      // ==============================
      // アニメーションループ
      // ==============================
      renderer.setAnimationLoop(() => {
        if (isFound) {
          // 模様がじわっと浮き出る
          pattern.material.opacity = Math.min(0.7, pattern.material.opacity + 0.015);
          pattern.rotation.z += 0.0008;

          if (title) {
            title.material.opacity = Math.min(1, title.material.opacity + 0.02);
          }
        }
        renderer.render(scene, camera);
      });

      await mindarThree.start();
    };

    start();
  </script>
</body>
</html>
